services:
  neo4j:
    image: neo4j:5
    container_name: fraud-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    env_file:
      - ../.env

    environment:
      NEO4J_PLUGINS: '["apoc"]'

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
